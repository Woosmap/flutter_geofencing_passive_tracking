name: woosmap_geofencing_rest_sample
description: "Sample: start Woosmap passiveTracking from Dart and forward geofence region events to a back-office via a native REST call."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Woosmap Geofencing Flutter plugin.
  geofencing_flutter_plugin: ^1.9.1

  # Used only to open the app's system settings (openAppSettings) when the
  # user has denied location and the OS will no longer show the prompt.
  # Permission requests themselves go through the Woosmap plugin.
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Generates the iOS + Android launcher icons from assets/icon/app_icon.png.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
